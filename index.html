<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEST Calendar</title>
<meta name="description" content="BEST International events and application deadlines, updated automatically from the group emails.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/calendar.css">
<script src="assets/calendar.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <button class="mark" type="button" data-today aria-label="Go to today" title="Go to today"><small id="mark-mon"></small><b id="mark-day"></b></button>
      <h1>BEST Calendar</h1>
    </div>
    <div class="top-nav" id="top-nav"></div>
  </header>

  <main id="view">
    <div class="state"><p>Loading events…</p></div>
  </main>
</div>

<section class="agenda" id="agenda" aria-label="Agenda">
  <button class="grip" id="grip" type="button" aria-expanded="false" aria-controls="ag-scroll" aria-label="Open the agenda" title="Agenda"><i></i></button>
  <div class="ag-scroll" id="ag-scroll" inert></div>
</section>

<nav class="catbar" aria-label="Categories">
  <div class="filters" id="filters" role="group" aria-label="Show events by category"></div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="tk-title" hidden>
  <div class="dr-bar"><button class="iconbtn" id="dr-close" type="button" aria-label="Close"></button></div>
  <div id="dr-body"></div>
</aside>
</body>
</html>
